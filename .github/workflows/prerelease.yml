name: Pre-Release

on:
  push:
    tags:
      - 'v*-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Pre-release tag (e.g. v0.2.0-rc.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: vibekeys-linux-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: vibekeys-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: vibekeys-windows-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux 用 musl 静态链接:不依赖构建机 glibc,任何 x86_64 Linux 都能跑。
      # ring(TLS 后端)含 C 代码,musl 下需要 musl-gcc;libdbus 由 vendored
      # feature 从源码编译(见 Cargo.toml 的 musl target 段)。
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename artifact
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/vibekeys.exe ${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/vibekeys ${{ matrix.artifact }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: artifacts/**/*
