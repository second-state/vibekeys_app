[package]
name = "vibekeys_app"
version = "0.1.2"
edition = "2021"

[[bin]]
name = "vibekeys"
path = "src/main.rs"

[dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0"
uuid = "1.0"
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
