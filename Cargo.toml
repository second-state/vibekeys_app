[package]
name = "vibekeys_app"
version = "0.1.5"
edition = "2021"

[[bin]]
name = "vibekeys"
path = "src/main.rs"

[dependencies]
btleplug = "0.11"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.8"
reqwest = { version = "0.13", features = ["blocking", "multipart", "json"] }
bytes = "1"
dialoguer = "0.11"
toml = "0.8"
dirs = "6"
arboard = "3"
futures = "0.3"

[target.'cfg(unix)'.dependencies]
daemonize = "0.5"
libc = "0.2"
