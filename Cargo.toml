[package]
name = "vibekeys_app"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"

[[bin]]
name = "vibekeys"
path = "src/main.rs"

[dependencies]
btleplug = "0.12"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
log = "0.4"
flexi_logger = "0.31"
env_logger = "0.11"
dirs = "5.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.8"
reqwest = { version = "0.13", features = ["blocking", "multipart", "json"] }
bytes = "1"
arboard = "3"
futures = "0.3"
dialoguer = "0.11"
